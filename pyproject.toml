[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evoweave_ds"
version = "0.1.0"
description = "面向已有 Python 仓库的动态多智能体软件演进系统（DeepSeek 单模型版）"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "LiYuwei", email = "1153789343@qq.com" },
]
dependencies = [
    "pydantic>=2.12,<3",
]

[project.scripts]
evoweave_ds = "evoweave_ds.interfaces.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pre-commit>=4,<5",
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/evoweave_ds"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
norecursedirs = ["tests/fixtures/repositories"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
include = ["src/**/*.py", "tests/**/*.py"]
extend-exclude = ["tests/fixtures/repositories"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF", "ASYNC", "DTZ", "PT"]
ignore = ["RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B017"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
